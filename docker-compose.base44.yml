services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    environment:
      # Let Vite accept the preview's external hostname (Vite >= 6.1 appends this to allowedHosts).
      # Passed through bare so the platform-provided value (.e2b.app wildcard) reaches the container.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-ec", "npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
